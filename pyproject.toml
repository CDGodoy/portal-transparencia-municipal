[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-etl"
version = "1.0.0"
description = "Pipeline de dados do Portal de Transparência Municipal (SICONFI, PNCP, BCB) com dbt + DuckDB"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "tenacity>=8.2",
  "typer>=0.12",
  "duckdb>=1.1",
  "dbt-core>=1.10,<2",
  "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[project.scripts]
portal = "portal_etl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["E501"]
"tests/*" = ["E501"]

[tool.ruff.format]
exclude = ["tests/fixtures/*"]
