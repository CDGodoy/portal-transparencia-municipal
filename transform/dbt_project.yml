name: portal_transparencia
version: "1.0.0"
config-version: 2
profile: portal

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

vars:
  # Diretório da camada bronze (NDJSON.gz particionado). Sobrescrito via env pelo CLI.
  bronze_dir: "{{ env_var('PORTAL_BRONZE_DIR', '../data/bronze') }}"
  # Tolerância (fração) para reconciliação entre relatórios.
  tolerancia_reconciliacao: 0.01

models:
  portal_transparencia:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: gold

seeds:
  portal_transparencia:
    +schema: ref
    municipios:
      +column_types:
        cod_ibge: bigint
        cnpj: varchar
        destaque: boolean
    funcoes_governo:
      +column_types:
        funcao_cod: varchar
    map_receitas_rreo:
      +column_types:
        ordem: integer
    map_despesas_natureza:
      +column_types:
        ordem: integer

tests:
  +store_failures: false

flags:
  send_anonymous_usage_stats: false
  partial_parse: true
